settings:
  # Automated Disaster Scheduler Cycle
  auto-scheduler:
    enabled: true
    # Interval between automatic disaster cycles in seconds (e.g. 3600 = 1 hour)
    interval-seconds: 3600
    # Pre-disaster warning countdown duration in seconds
    warning-delay-seconds: 30
    # Minimum online players required for automated disaster triggers
    minimum-players: 1

  # Worlds where disasters will NEVER occur or affect blocks
  disabled-worlds:
    - "world_the_end"

  # Third-Party Land Protection & Claim Hooks
  # Automatically detects WorldGuard, GriefPrevention, Towny, and Lands.
  protection:
    respect-claims: true

  # Memory-Safe Block Restoration Engine (Zero-TPS-Drop Standard)
  block-restoration:
    enabled: true
    # How many modified blocks are restored per server tick (e.g. 25-50 prevents lag spikes)
    blocks-per-tick: 25
    # When enabled, high-volume liquid events (Tsunami) send packet-based ghost blocks
    # instead of true world mutations, delivering full visual intensity with zero block saves.
    use-ghost-blocks-for-liquids: false

# ==============================================================================
#                          DISASTER CONFIGURATIONS
# ==============================================================================

